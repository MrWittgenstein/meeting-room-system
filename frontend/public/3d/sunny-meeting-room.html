<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阳光会议室 · Coastal Meeting Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #f0efe8; font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
        canvas { display: block; }

        .loading {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #f0efe8; color: rgba(100,110,120,0.5); font-size: 14px;
            letter-spacing: 3px; transition: opacity 0.8s ease; z-index: 100;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="loading" id="loading">加载中 ...</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // ====================================================================
    //  SCENE SETUP
    // ====================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8e5de);
    scene.fog = new THREE.Fog(0xe8e5de, 14, 30);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(5.5, 2.2, 1.8);
    camera.lookAt(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.2;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.enabled = false;
    controls.update();

    renderer.domElement.style.cursor = 'pointer';
    renderer.domElement.addEventListener('click', () => {
        controls.enabled = !controls.enabled;
        renderer.domElement.style.cursor = controls.enabled ? 'grab' : 'pointer';
    });
    renderer.domElement.addEventListener('mousedown', () => {
        if (controls.enabled) renderer.domElement.style.cursor = 'grabbing';
    });
    renderer.domElement.addEventListener('mouseup', () => {
        if (controls.enabled) renderer.domElement.style.cursor = 'grab';
    });

    // ====================================================================
    //  PROCEDURAL TEXTURES
    // ====================================================================
    function createMarbleFloor() {
        const s = 1024;
        const c = document.createElement('canvas');
        c.width = s; c.height = s;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#f2f0ea';
        ctx.fillRect(0, 0, s, s);

        for (let i = 0; i < 30; i++) {
            ctx.strokeStyle = `rgba(180,175,165,${0.03 + Math.random() * 0.04})`;
            ctx.lineWidth = 0.5 + Math.random() * 1.5;
            ctx.beginPath();
            let x = Math.random() * s;
            let y = Math.random() * s;
            ctx.moveTo(x, y);
            for (let j = 0; j < 5; j++) {
                x += (Math.random() - 0.5) * 200;
                y += (Math.random() - 0.5) * 200;
                ctx.lineTo(Math.max(0, Math.min(s, x)), Math.max(0, Math.min(s, y)));
            }
            ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 2);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
    }

    function createPlasterTexture() {
        const s = 512;
        const c = document.createElement('canvas');
        c.width = s; c.height = s;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#faf8f5';
        ctx.fillRect(0, 0, s, s);

        for (let i = 0; i < 6000; i++) {
            const x = Math.random() * s;
            const y = Math.random() * s;
            ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.012})`;
            ctx.fillRect(x, y, 2, 2);
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 2);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
    }

    function createOceanView() {
        const w = 768, h = 1024;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');

        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.55);
        sky.addColorStop(0, '#b5d8f0');
        sky.addColorStop(0.5, '#d4e8f8');
        sky.addColorStop(1, '#eaf4fa');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h * 0.55);

        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            const cx = 80 + Math.random() * (w - 160);
            const cy = 40 + Math.random() * (h * 0.35);
            ctx.ellipse(cx, cy, 50 + Math.random() * 80, 15 + Math.random() * 20, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        const ocean = ctx.createLinearGradient(0, h * 0.55, 0, h);
        ocean.addColorStop(0, '#6aadc8');
        ocean.addColorStop(0.3, '#5a9db8');
        ocean.addColorStop(0.6, '#4a8aa8');
        ocean.addColorStop(1, '#3a7a98');
        ctx.fillStyle = ocean;
        ctx.fillRect(0, h * 0.55, w, h * 0.45);

        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 20; i++) {
            ctx.beginPath();
            ctx.moveTo(Math.random() * w, h * 0.55 + Math.random() * h * 0.35);
            for (let j = 0; j < 8; j++) {
                ctx.lineTo(j * w / 7, h * 0.55 + Math.random() * h * 0.3);
            }
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255,240,200,0.12)';
        ctx.beginPath();
        ctx.ellipse(w * 0.7, h * 0.6, 120, 35, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.moveTo(w * 0.3, h * 0.63);
        ctx.lineTo(w * 0.3, h * 0.55);
        ctx.lineTo(w * 0.28, h * 0.6);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.moveTo(w * 0.3, h * 0.63);
        ctx.lineTo(w * 0.3, h * 0.55);
        ctx.lineTo(w * 0.32, h * 0.58);
        ctx.fill();

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
    }

    // ====================================================================
    //  MATERIALS
    // ====================================================================
    const mat = {
        wall:   new THREE.MeshStandardMaterial({ map: createPlasterTexture(), roughness: 0.9, metalness: 0.0, color: 0xf5f3ef }),
        floor:  new THREE.MeshStandardMaterial({ map: createMarbleFloor(), roughness: 0.15, metalness: 0.05 }),
        ceiling: new THREE.MeshStandardMaterial({ color: 0xf5f3ef, roughness: 0.9, metalness: 0.0 }),
        baseboard: new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 0.5 }),
        trim:   new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.4 }),

        tableTop: new THREE.MeshStandardMaterial({ color: 0xfaf8f4, roughness: 0.2, metalness: 0.05 }),
        tableBase: new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.3, metalness: 0.08 }),

        chairSeat: (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.0 }),
        chairLeg: new THREE.MeshStandardMaterial({ color: 0xcfc5b8, roughness: 0.1, metalness: 0.75 }),
        chairBack: (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.0 }),

        glass: new THREE.MeshPhysicalMaterial({
            color: 0xc8ddee, transparent: true, opacity: 0.08,
            roughness: 0.01, metalness: 0.0, side: THREE.DoubleSide,
        }),
        windowFrame: new THREE.MeshStandardMaterial({ color: 0xf0ece6, roughness: 0.3, metalness: 0.05 }),
        windowFrameDark: new THREE.MeshStandardMaterial({ color: 0x444448, roughness: 0.15, metalness: 0.85 }),

        screenFrame: new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 0.3, metalness: 0.1 }),
        screenGlow: new THREE.MeshStandardMaterial({ color: 0xaaccff, emissive: 0x4488cc, emissiveIntensity: 0.1, roughness: 0.2 }),

        plantPot: new THREE.MeshStandardMaterial({ color: 0xefeae2, roughness: 0.4, metalness: 0.02 }),
        plantPotTerracotta: new THREE.MeshStandardMaterial({ color: 0xe8d5c4, roughness: 0.6 }),
        plantLeaf: new THREE.MeshStandardMaterial({ color: 0x5c9a6a, roughness: 0.8 }),
        plantLeafLight: new THREE.MeshStandardMaterial({ color: 0x7cb88a, roughness: 0.8 }),

        rug: new THREE.MeshStandardMaterial({ color: 0xf0ede8, roughness: 0.9 }),
        rugPattern: new THREE.MeshStandardMaterial({ color: 0xe8e0d8, roughness: 0.85 }),

        lightGlass: new THREE.MeshPhysicalMaterial({
            color: 0xfffff5, transparent: true, opacity: 0.3,
            roughness: 0.1, metalness: 0.0,
        }),
        lightCord: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 }),
        lightCap: new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.2, metalness: 0.15 }),

        vaseBlue: new THREE.MeshPhysicalMaterial({ color: 0x88bbdd, roughness: 0.1, metalness: 0.0, transparent: true, opacity: 0.4 }),
        book: (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 }),
    };

    // ====================================================================
    //  ROOM
    // ====================================================================
    const ROOM_W = 14;
    const ROOM_D = 10;
    const ROOM_H = 3.8;

    function buildRoom() {
        const g = new THREE.Group();

        // Floor
        const floor = new THREE.Mesh(
            new THREE.BoxGeometry(ROOM_W, 0.10, ROOM_D),
            mat.floor
        );
        floor.position.set(0, -0.05, 0);
        floor.receiveShadow = true;
        g.add(floor);

        // Baseboards
        const bbMat = mat.baseboard;
        const bbH = 0.08, bbD = 0.03;
        const bbGeo = new THREE.BoxGeometry(ROOM_W, bbH, bbD);
        const bbGeo2 = new THREE.BoxGeometry(bbD, bbH, ROOM_D);
        for (const [geo, pos] of [
            [bbGeo, [0, 0, -ROOM_D/2]],
            [bbGeo, [0, 0, ROOM_D/2]],
            [bbGeo2, [-ROOM_W/2, 0, 0]],
        ]) {
            const m = new THREE.Mesh(geo, bbMat);
            m.position.set(...pos);
            g.add(m);
        }

        const wallMat = mat.wall;

        // Back wall (z-negative) solid
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, ROOM_H, 0.12), wallMat);
        backWall.position.set(0, ROOM_H / 2, -ROOM_D / 2);
        backWall.castShadow = true;
        g.add(backWall);

        // Front wall (z-positive) solid
        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, ROOM_H, 0.12), wallMat);
        frontWall.position.set(0, ROOM_H / 2, ROOM_D / 2);
        frontWall.castShadow = true;
        g.add(frontWall);

        // Right wall — replaced by door cutout pieces

        // Ceiling
        const ceiling = new THREE.Mesh(
            new THREE.BoxGeometry(ROOM_W, 0.06, ROOM_D),
            mat.ceiling
        );
        ceiling.position.set(0, ROOM_H, 0);
        g.add(ceiling);

        // Crown molding
        const crownMat = mat.trim;
        const crownGeo = new THREE.BoxGeometry(ROOM_W + 0.1, 0.04, 0.04);
        const crownGeo2 = new THREE.BoxGeometry(0.04, 0.04, ROOM_D + 0.1);
        for (const [geo, pos] of [
            [crownGeo, [0, ROOM_H - 0.02, -ROOM_D/2 - 0.02]],
            [crownGeo, [0, ROOM_H - 0.02, ROOM_D/2 + 0.02]],
            [crownGeo2, [-ROOM_W/2 - 0.02, ROOM_H - 0.02, 0]],
            [crownGeo2, [ROOM_W/2 + 0.02, ROOM_H - 0.02, 0]],
        ]) {
            const m = new THREE.Mesh(geo, crownMat);
            m.position.set(...pos);
            g.add(m);
        }

        return g;
    }

    scene.add(buildRoom());

    // ====================================================================
    //  LEFT WALL — FLOOR-TO-CEILING WINDOWS (clean, no arch confusion)
    // ====================================================================
    // We put the window group directly at the left wall (x = -ROOM_W/2).
    // The left wall itself is NOT built in buildRoom() — the windows replace it.
    // To fill the gap between windows, we place wall segments.

    function createWindowWall() {
        const g = new THREE.Group();
        const wallMat = mat.wall;
        const frameMat = mat.windowFrameDark;
        const glassMat = mat.glass;
        const viewTex = createOceanView();

        const panelCount = 4;
        const panelW = (ROOM_D - 0.6) / panelCount; // ~2.35 each
        const glassH = ROOM_H - 0.6;
        const wallX = -ROOM_W / 2;

        for (let i = 0; i < panelCount; i++) {
            const zPos = -ROOM_D / 2 + 0.3 + i * panelW + panelW / 2;
            const gap = 0.08; // gap between panels

            // Wall segment between windows
            const segW = Math.max(0.02, panelW - (panelW - gap));
            if (i < panelCount - 1) {
                const wallSeg = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, ROOM_H, gap),
                    wallMat
                );
                wallSeg.position.set(wallX, ROOM_H / 2, zPos + panelW / 2 + gap / 2);
                wallSeg.castShadow = true;
                g.add(wallSeg);
            }

            // Leftmost wall filler
            if (i === 0) {
                const leftFill = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, ROOM_H, 0.3),
                    wallMat
                );
                leftFill.position.set(wallX, ROOM_H / 2, -ROOM_D / 2 + 0.15);
                leftFill.castShadow = true;
                g.add(leftFill);
            }
            if (i === panelCount - 1) {
                const rightFill = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, ROOM_H, 0.3),
                    wallMat
                );
                rightFill.position.set(wallX, ROOM_H / 2, ROOM_D / 2 - 0.15);
                rightFill.castShadow = true;
                g.add(rightFill);
            }

            // Frame vertical left
            const vL = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, glassH, 0.04),
                frameMat
            );
            vL.position.set(wallX - 0.06, ROOM_H / 2, zPos - panelW / 2 + 0.02);
            g.add(vL);

            if (i === panelCount - 1) {
                const vR = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, glassH, 0.04),
                    frameMat
                );
                vR.position.set(wallX - 0.06, ROOM_H / 2, zPos + panelW / 2 - 0.02);
                g.add(vR);
            }

            // Glass panel
            const glass = new THREE.Mesh(
                new THREE.BoxGeometry(0.08, glassH - 0.08, panelW - 0.12),
                glassMat
            );
            glass.position.set(wallX - 0.02, ROOM_H / 2, zPos);
            g.add(glass);

            // Ocean view backdrop (behind glass, facing inward)
            const view = new THREE.Mesh(
                new THREE.PlaneGeometry(panelW - 0.16, glassH - 0.12),
                new THREE.MeshBasicMaterial({ map: viewTex, side: THREE.DoubleSide })
            );
            view.position.set(wallX - 0.06, ROOM_H / 2, zPos);
            view.rotation.y = -Math.PI / 2;
            g.add(view);

            // Horizontal divider
            const divH = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.02, panelW - 0.08),
                frameMat
            );
            divH.position.set(wallX - 0.04, ROOM_H * 0.6, zPos);
            g.add(divH);

            // Top frame
            const topF = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.05, panelW - 0.04),
                frameMat
            );
            topF.position.set(wallX - 0.06, ROOM_H - 0.02, zPos);
            g.add(topF);

            // Bottom frame
            const botF = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.05, panelW - 0.04),
                frameMat
            );
            botF.position.set(wallX - 0.06, 0.02, zPos);
            g.add(botF);

            // Window sill
            const sill = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 0.03, panelW + 0.04),
                mat.baseboard
            );
            sill.position.set(wallX - 0.04, 0.015, zPos);
            g.add(sill);
        }

        // Wall left fill (above and below glass)
        const topFill = new THREE.Mesh(
            new THREE.BoxGeometry(0.12, 0.3, ROOM_D - 0.6),
            wallMat
        );
        topFill.position.set(wallX, ROOM_H - 0.15, 0);
        g.add(topFill);

        const botFill = new THREE.Mesh(
            new THREE.BoxGeometry(0.12, 0.25, ROOM_D - 0.6),
            wallMat
        );
        botFill.position.set(wallX, 0.125, 0);
        g.add(botFill);

        return g;
    }

    scene.add(createWindowWall());

    // ====================================================================
    //  OVAL CONFERENCE TABLE
    // ====================================================================
    function createOvalTable() {
        const g = new THREE.Group();

        // Oval table top
        const topGeo = new THREE.CylinderGeometry(2.6, 2.6, 0.06, 48);
        const scaleZ = 0.65;
        const positions = topGeo.getAttribute('position');
        for (let i = 0; i < positions.count; i++) {
            positions.setZ(i, positions.getZ(i) * scaleZ);
        }
        positions.needsUpdate = true;
        topGeo.computeVertexNormals();

        const top = new THREE.Mesh(topGeo, mat.tableTop);
        top.position.y = 0.72;
        top.castShadow = true;
        top.receiveShadow = true;
        g.add(top);

        // Central pedestal base — properly positioned BELOW the table top
        const baseMat = mat.tableBase;

        // Base disc (bottom)
        const baseDisc = new THREE.Mesh(
            new THREE.CylinderGeometry(0.65, 0.75, 0.04, 24),
            baseMat
        );
        baseDisc.position.y = 0.02;
        g.add(baseDisc);

        // Pedestal column (tapered)
        const column = new THREE.Mesh(
            new THREE.CylinderGeometry(0.18, 0.60, 0.55, 24),
            baseMat
        );
        column.position.y = 0.35;
        g.add(column);

        // Top plate (just under the table top, no overlap)
        const topPlate = new THREE.Mesh(
            new THREE.CylinderGeometry(0.30, 0.22, 0.04, 24),
            baseMat
        );
        topPlate.position.y = 0.67;
        g.add(topPlate);

        return g;
    }

    const table = createOvalTable();
    table.position.set(0, 0, 0);
    scene.add(table);

    // ====================================================================
    //  MODERN CHAIRS — properly positioned outside the oval table
    // ====================================================================
    const chairColors = [
        { seat: 0xf5e6d0, back: 0xf5e6d0 },
        { seat: 0xd4e4d8, back: 0xd4e4d8 },
        { seat: 0xd8dce8, back: 0xd8dce8 },
        { seat: 0xf0ddd8, back: 0xf0ddd8 },
        { seat: 0xd8e4e8, back: 0xd8e4e8 },
        { seat: 0xe8e0d4, back: 0xe8e0d4 },
        { seat: 0xdce4d4, back: 0xdce4d4 },
        { seat: 0xe8d8d8, back: 0xe8d8d8 },
    ];

    function createModernChair(colorIdx) {
        const g = new THREE.Group();
        const colors = chairColors[colorIdx];
        const seatMat = mat.chairSeat(colors.seat);
        const backMat = mat.chairBack(colors.back);
        const legMat = mat.chairLeg;

        // Seat cushion (round)
        const seat = new THREE.Mesh(
            new THREE.CylinderGeometry(0.22, 0.24, 0.05, 24),
            seatMat
        );
        seat.position.y = 0.44;
        seat.castShadow = true;
        g.add(seat);

        // Backrest
        const backFill = new THREE.Mesh(
            new RoundedBoxGeometry(0.38, 0.28, 0.03, 4, 0.02),
            backMat
        );
        backFill.position.set(0, 0.66, -0.18);
        g.add(backFill);

        // Back frame bar
        const frameBar = new THREE.Mesh(
            new THREE.TorusGeometry(0.19, 0.01, 8, 16, Math.PI * 0.6),
            legMat
        );
        frameBar.position.set(0, 0.64, -0.19);
        frameBar.rotation.x = 0.3;
        g.add(frameBar);

        // Slim brass legs (4 splayed)
        const legPositions = [
            [-0.16, -0.16],
            [0.16, -0.16],
            [-0.16, 0.16],
            [0.16, 0.16],
        ];
        for (const [lx, lz] of legPositions) {
            const leg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.007, 0.011, 0.40, 6),
                legMat
            );
            leg.position.set(lx, 0.20, lz);
            leg.rotation.x = lz * 0.35;
            leg.rotation.z = -lx * 0.35;
            leg.castShadow = true;
            g.add(leg);

            const foot = new THREE.Mesh(
                new THREE.SphereGeometry(0.012, 6, 6),
                legMat
            );
            foot.position.set(lx, 0.005, lz);
            g.add(foot);
        }

        return g;
    }

    // Place chairs on the two long sides of the oval table
    // Table oval: X radius = 2.6 (long), Z radius = 1.69 (short)
    // Chairs sit on the long sides (+Z and -Z), 3 per side, evenly spaced
    const chairZ = 2.35; // distance from center along Z (past table edge at 1.69)
    const chairXs = [-1.8, 0, 1.8]; // X positions evenly spread along the table's length

    for (let side = 0; side < 2; side++) {
        const zSign = side === 0 ? 1 : -1;
        for (let i = 0; i < 3; i++) {
            const rx = chairXs[i];
            const rz = zSign * chairZ;
            const chair = createModernChair(side * 3 + i);
            chair.position.set(rx, 0, rz);
            // Face the table center
            chair.rotation.y = zSign > 0 ? Math.PI : 0;
            scene.add(chair);
        }
    }

    // ====================================================================
    //  LARGE DISPLAY SCREEN
    // ====================================================================
    function createDisplayScreen() {
        const g = new THREE.Group();
        const sw = 3.0, sh = 1.7;

        const frame = new THREE.Mesh(
            new RoundedBoxGeometry(sw, sh, 0.04, 4, 0.015),
            mat.screenFrame
        );
        frame.position.set(0, 0, -0.02);
        g.add(frame);

        const screen = new THREE.Mesh(
            new THREE.BoxGeometry(sw - 0.06, sh - 0.06, 0.015),
            mat.screenGlow
        );
        screen.position.set(0, 0, 0.005);
        g.add(screen);

        const contentCanvas = document.createElement('canvas');
        contentCanvas.width = 640;
        contentCanvas.height = 360;

        const g = new THREE.Group();

            // Left

            // Right
            { geo: new THREE.BoxGeometry(frameDepth, dh + frameW * 2, frameW), pos: [wallThick / 2, dh / 2, dw / 2 + frameW / 2] },

        for (const p of framePieces) {

        const doorPanel = new THREE.Mesh(
            new RoundedBoxGeometry(0.035, dh - 0.04, dw - 0.06, 4, 0.01),

        doorPanel.castShadow = true;

        // Hinge group: pivot at left edge of door, rotate to show open
        const doorGroup = new THREE.Group();
        doorGroup.position.set(wallThick + 0.005, dh / 2, -dw / 2);

        // Panel detail on door face

        // Handle (brass) — on the door, at the opening edge
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xd4c8b8, roughness: 0.1, metalness: 0.85 });
        const handleBar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.007, 0.007, 0.22),
            handleMat
        );
        handleBar.rotation.x = Math.PI / 2;
        handleBar.position.set(0, 0, dw - 0.08);

        // Handle base plate
        const handlePlate = new THREE.Mesh(
            new THREE.CylinderGeometry(0.018, 0.018, 0.005, 8),
            handleMat

        handlePlate.position.set(0, 0.02, dw - 0.08);

        g.add(thresh);

        return g;

    function applyDevices() {
      acLed2.material.color.set(devState.airConditioner ? 0x44ff44 : 0x222222);
      acLed2.material.emissive.set(devState.airConditioner ? 0x00ff00 : 0x000000);
      acLed2.material.emissiveIntensity = devState.airConditioner ? 2.5 : 0.0;
      acLed2.scale.setScalar(devState.airConditioner ? 1.6 : 1.0);
      ambient.intensity = devState.light ? 0.35 : 0.04;
      windowLight.intensity = devState.light ? 2.0 : 0.15;
      // 首次查找屏幕的所有子mesh
      if (!window._screenMeshes && typeof screen !== 'undefined' && screen) {
        window._screenMeshes = [];
        screen.traverse(o => { if (o.isMesh) window._screenMeshes.push(o); });
      }
      if (window._screenMeshes) {
        window._screenMeshes.forEach(o => {
          if (o.material.emissive) {
            o.material.emissiveIntensity = devState.projector ? 0.12 : 0.0;
            o.material.color.set(devState.projector ? 0x88bbff : 0x000000);
            o.material.emissive.set(devState.projector ? 0x4488cc : 0x000000);
          }
          if (o.material.map && o.material.isMeshBasicMaterial) {
            o.material.color.set(devState.projector ? 0xffffff : 0x000000);
          }
        });
      }
      doorTargetAng = devState.door ? doorClosedRot : doorOpenRot;
      doorAngVel = (doorTargetAng - hingePivot.rotation.y) * 0.35;
    }
    let _applyPending2 = false;
    const _debouncedApply2 = () => { if (!_applyPending2) { _applyPending2 = true; requestAnimationFrame(() => { applyDevices(); _applyPending2 = false; }); } };
    window.setDevice = (k, v) => { if (k in devState && devState[k] !== v) { devState[k] = v; _debouncedApply2(); } };
    window.getDeviceState = () => ({ ...devState });
    window.addEventListener('message', e => {
      if (e.source !== window.parent) return;
      if (e.data?.type === 'setDevice') { window.setDevice(e.data.key, e.data.value); }
      if (e.data?.type === 'getState') window.parent.postMessage({ type: 'deviceStateChanged', state: window.getDeviceState() }, '*');
    });

    // ====================================================================
    //  RESIZE & ANIMATION
    // ====================================================================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        { const da = doorTargetAng - hingePivot.rotation.y; if (Math.abs(da) > 0.0005 || Math.abs(doorAngVel) > 0.0005) { doorAngVel += da * 0.08; doorAngVel *= 0.88; hingePivot.rotation.y += doorAngVel; if (Math.abs(da) < 0.001 && Math.abs(doorAngVel) < 0.001) { hingePivot.rotation.y = doorTargetAng; doorAngVel = 0; } } }
        renderer.render(scene, camera);
    }

    document.getElementById('loading').classList.add('hidden');
    animate();
    setTimeout(() => window.parent.postMessage({ type: 'threeReady' }, '*'), 600);

    console.log('☀ 阳光会议室已加载 | Sunlit Coastal Meeting Room');
    </script>
</body>
</html>
