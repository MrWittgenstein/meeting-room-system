server:
  port: ${TOPBIZ_PORT:8080}

spring:
  application:
    name: zongshe-topbiz
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  cloud:
    gateway:
      server:
        webflux:
          enabled: true
          httpclient:
            connect-timeout: 2000
            response-timeout: 8s

gateway:
  rate-limit:
    login-rps: ${GATEWAY_LOGIN_RPS:5}
    query-rps: ${GATEWAY_QUERY_RPS:20}
    control-rps: ${GATEWAY_CONTROL_RPS:5}
    burst: ${GATEWAY_BURST:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
