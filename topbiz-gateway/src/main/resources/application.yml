server:
  port: ${TOPBIZ_PORT:8080}

spring:
  application:
    name: zongshe-topbiz
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  cloud:
    gateway:
      server:
        webflux:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
