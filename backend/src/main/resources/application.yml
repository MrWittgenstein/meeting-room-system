app:
  master:
    key: 123456

server:
  address: ${MEETINGROOM_BIND_ADDRESS:127.0.0.1}
  port: ${MEETINGROOM_PORT:8084}

auth:
  session:
    ttl: ${AUTH_SESSION_TTL:12h}

spring:
  application:
    name: meetingroom-main

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:true}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESS:http://127.0.0.1:18080/xxl-job-admin}
    executor:
      appname: meetingroom-executor
      accessToken: ${XXL_JOB_ACCESS_TOKEN:}
      ip: ${XXL_JOB_EXECUTOR_IP:host.docker.internal}
      port: ${XXL_JOB_EXECUTOR_PORT:9996}
      logpath: ${XXL_JOB_LOG_PATH:./run-logs/xxl-job}
      logretentiondays: 14
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:meeting-room}
        group: ${NACOS_GROUP:MEETING_ROOM_GROUP}
        register-enabled: ${NACOS_REGISTER_ENABLED:${NACOS_ENABLED:false}}
        service: ${NACOS_SERVICE_NAME:meetingroom-main}
        ip: ${NACOS_IP:}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/meetingroom?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: meetingroom
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    username: 17638875766@163.com
    password: FYb4msMRjwN9ZEHG
    host: smtp.163.com
    port: 465  # 添加这行，使用465端口
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true  # 465端口需要SSL
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

    redisson:
      config: |
        singleServerConfig:
          address: "redis://127.0.0.1:6379"
          database: ${spring.data.redis.database}
          connectionMinimumIdleSize: 5
          connectionPoolSize: 10
          idleConnectionTimeout: 30000
          connectTimeout: 10000
          timeout: 3000


aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: LTAI5t97DWsUbDe1f5XS5mQr
    access-key-secret: M7KBp5nXHcnA24uazTScSOwIpZl2vH
    bucket-name: javasyl
    base-url: https://javasyl.oss-cn-beijing.aliyuncs.com


springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.uestcfir.pojo.entity
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true

iot:
  device-auth:
    tokens:
      raspi-01: ${IOT_DEVICE_TOKEN:}

business-cache:
  enabled: ${BUSINESS_CACHE_ENABLED:true}
  room-list-ttl: ${ROOM_LIST_CACHE_TTL:5m}
  telemetry-ttl: ${TELEMETRY_CACHE_TTL:5s}

# External ownership boundaries. Keep disabled during local legacy-only runs;
# enable after user-management and notification-service are deployed.
platform-services:
  enabled: ${PLATFORM_SERVICES_ENABLED:true}
  discovery-enabled: ${PLATFORM_DISCOVERY_ENABLED:false}
  internal-token: ${PLATFORM_INTERNAL_TOKEN:}
  user-service-url: ${USER_SERVICE_URL:http://127.0.0.1:8181}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://127.0.0.1:8182}
  user-service-name: ${USER_SERVICE_NAME:meeting-user-service}
  notification-service-name: ${NOTIFICATION_SERVICE_NAME:meeting-notification-service}
