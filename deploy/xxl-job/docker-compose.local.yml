services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: meeting-room-xxl-job-admin
    restart: unless-stopped
    environment:
      PARAMS: >-
        --server.port=8080
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://host.docker.internal:3306/${XXL_JOB_DB_NAME:-xxl_job_local}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${XXL_JOB_DB_USERNAME:?Set XXL_JOB_DB_USERNAME}
        --spring.datasource.password=${XXL_JOB_MYSQL_ROOT_PASSWORD:?Set XXL_JOB_MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?Set XXL_JOB_ACCESS_TOKEN}
        --xxl.job.logretentiondays=30
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:8080"
