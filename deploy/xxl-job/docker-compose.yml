services:
  mysql:
    image: mysql:8.0
    container_name: meeting-room-xxl-job-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_ROOT_PASSWORD:?Set XXL_JOB_MYSQL_ROOT_PASSWORD before starting}
      MYSQL_DATABASE: xxl_job
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - xxl-job-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: meeting-room-xxl-job-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --server.port=8080
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${XXL_JOB_MYSQL_ROOT_PASSWORD:?Set XXL_JOB_MYSQL_ROOT_PASSWORD before starting}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?Set XXL_JOB_ACCESS_TOKEN before starting}
        --xxl.job.logretentiondays=30
      TZ: Asia/Shanghai
    ports:
      - "18080:8080"

volumes:
  xxl-job-mysql-data:
