server:
  port: ${CACHE_INVALIDATION_PORT:8095}

spring:
  application:
    name: cache-invalidation-service
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

cache-invalidation:
  canal-host: ${CANAL_HOST:127.0.0.1}
  canal-port: ${CANAL_PORT:11111}
  canal-destination: ${CANAL_DESTINATION:meetingroom}
  canal-username: ${CANAL_USERNAME:canal}
  canal-password: ${CANAL_PASSWORD:canal}
  rabbit-exchange: ${CACHE_INVALIDATION_EXCHANGE:cache.invalidation}
  rabbit-routing-key: ${CACHE_INVALIDATION_ROUTING_KEY:cache.invalidate}
  batch-size: ${CANAL_BATCH_SIZE:100}
